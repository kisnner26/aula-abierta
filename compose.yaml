name: aula-abierta

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aula_abierta}
      POSTGRES_USER: ${DB_USERNAME:-aula}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aula-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aula-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aula-minio-development}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: local
      APP_NAME: Aula Abierta
      APP_DEBUG: 'true'
      AULA_DOCKER_APP_KEY: ${APP_KEY:-}
      AULA_ENV_PATH: /app/storage/docker
      APP_URL: http://127.0.0.1:${BACKEND_PORT:-8000}
      APP_FRONTEND_URL: http://127.0.0.1:${FRONTEND_PORT:-5173}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${FRONTEND_PORT:-5173}
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:${FRONTEND_PORT:-5173},localhost:${FRONTEND_PORT:-5173}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: ${DB_DATABASE:-aula_abierta}
      DB_USERNAME: ${DB_USERNAME:-aula}
      DB_PASSWORD: ${DB_PASSWORD:-aula-development}
      FILESYSTEM_DISK: r2
      PROTECTED_FILESYSTEM_DISK: r2
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-aula-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-aula-minio-development}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-aula-abierta}
      AWS_ENDPOINT: http://minio:9000
      AWS_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_PORT:-9000}
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      TELESCOPE_ENABLED: 'false'
      PHP_CLI_SERVER_WORKERS: '4'
      AULA_SEED_SUPER_ADMIN_PASSWORD: ${AULA_SEED_SUPER_ADMIN_PASSWORD:-AulaDocker!2026}
      AULA_SEED_COORDINATOR_PASSWORD: ${AULA_SEED_COORDINATOR_PASSWORD:-AulaDocker!2026}
      AULA_SEED_TRAINER_PASSWORD: ${AULA_SEED_TRAINER_PASSWORD:-AulaDocker!2026}
      AULA_SEED_STUDENT_PASSWORD: ${AULA_SEED_STUDENT_PASSWORD:-AulaDocker!2026}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8000}:8000'
    volumes:
      - ./aula-abierta-backend:/app
      # Mask the host's native .env and dependencies; never rewrite them.
      - ./aula-abierta-backend/.env.example:/app/.env:ro
      - backend_vendor:/app/vendor
      - backend_storage:/app/storage
      - backend_cache:/app/bootstrap/cache
      - backend_public:/app/public
      - ./aula-abierta-backend/public/index.php:/app/public/index.php:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8000}/api/v1
      VITE_APP_NAME: Aula Abierta
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./aula-abierta-frontend:/app
      - ./aula-abierta-frontend/.env.example:/app/.env:ro
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
  backend_vendor:
  backend_storage:
  backend_cache:
  backend_public:
  frontend_modules:
