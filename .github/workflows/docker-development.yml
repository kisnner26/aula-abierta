name: Docker development stack

on:
  push:
    paths: ['compose.yaml', '.dockerignore', '.env.example', '.gitattributes', 'docker/**', 'aula-abierta-backend/**', 'aula-abierta-frontend/**', '.github/workflows/docker-development.yml']
  pull_request:
    paths: ['compose.yaml', '.dockerignore', '.env.example', '.gitattributes', 'docker/**', 'aula-abierta-backend/**', 'aula-abierta-frontend/**', '.github/workflows/docker-development.yml']

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start from a fresh checkout
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check auth, private storage and persistence
        run: python3 docker/smoke-test.py
      - name: Build frontend
        run: docker compose exec -T frontend npm run build
      - name: Run backend suite on a separate database
        run: |
          docker compose exec -T postgres createdb -U aula aula_abierta_test
          docker compose exec -T backend sh -ec '
            export APP_ENV=testing DB_DATABASE=aula_abierta_test
            php artisan migrate --seed --force
            php artisan test
          '
      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
