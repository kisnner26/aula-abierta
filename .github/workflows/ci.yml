name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aula-abierta-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./aula-abierta-frontend
      - name: Build frontend
        run: npm run build
        working-directory: ./aula-abierta-frontend
